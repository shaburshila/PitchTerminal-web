<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard and trading panel for pitchwc.app markets — player and country tokens on Base"
    />
    <title>PitchTerminal — pitchwc.app dashboard</title>
    <!-- Phase 1.5 batch 2: brand fonts. `display=swap` shows a system fallback
         until the webfont arrives so first paint isn't blocked. `preconnect`
         warms the TLS connection before the CSS @font-face fires. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app requires JavaScript. Please enable JavaScript in your browser.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
