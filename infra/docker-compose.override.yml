# Локальная разработка — overrides поверх docker-compose.yml.
# `docker compose` подхватывает override.yml автоматически, если он лежит
# рядом с docker-compose.yml и компоуз вызывается с обоими -f (см.
# scripts/dev-up.sh).
#
# На проде этот файл НЕ используется (compose там запускается с одним -f).

services:
  postgres:
    ports:
      # Хост-порт переопределяется через PT_PG_HOST_PORT, если 5432 занят.
      # Bind только на 127.0.0.1 — Postgres не слушает на всех интерфейсах ноута,
      # снижает риск случайной отдачи БД в чужую сеть (кафе/coworking).
      - "127.0.0.1:${PT_PG_HOST_PORT:-5432}:5432"

  api:
    ports:
      # Прямой доступ к API минуя Caddy — удобно для локальных тестов
      # (curl localhost:8000/api/v1/health). На проде НЕ публикуется.
      # Bind только на 127.0.0.1 — см. комментарий к postgres выше.
      - "127.0.0.1:${PT_API_HOST_PORT:-8000}:8000"

  caddy:
    # В проде SPA вшит в caddy-образ через multi-stage build (см.
    # infra/caddy/Dockerfile). Локально маунтим ../frontend/dist напрямую,
    # чтобы `pnpm build --watch` рядом давал hot-reload без rebuild'а образа.
    # На проде compose запускается БЕЗ этого override (см. deploy.yml).
    volumes:
      - ../frontend/dist:/srv/frontend:ro
