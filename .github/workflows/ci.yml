name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint (ruff + black + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: black --check
        run: black --check .

      - name: mypy --strict (shared + scripts)
        run: mypy --strict shared scripts

  backend-test:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: pt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pt -d pt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pt:pt@localhost:5432/pt
      JWT_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      RPC_URL: https://mainnet.base.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: pytest
        run: python -m pytest tests/ -v

  frontend-lint-test:
    name: Frontend lint + test (eslint + prettier + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier --check
        run: pnpm run format:check

      - name: Vitest
        run: pnpm run test

  contracts-lint-build-test:
    name: Contracts lint + build + test (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache OZ dependency
        id: cache-oz
        uses: actions/cache@v4
        with:
          path: contracts/lib
          key: ${{ runner.os }}-foundry-oz-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/README.md') }}

      - name: Install OpenZeppelin v5.0.2
        if: steps.cache-oz.outputs.cache-hit != 'true'
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test -vv

      - name: forge coverage (summary, advisory)
        run: forge coverage --report summary
        continue-on-error: true
