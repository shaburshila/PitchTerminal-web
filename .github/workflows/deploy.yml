name: Deploy

# Auto-deploy на VPS после успешного прохождения CI на main.
#
# Триггер: `workflow_run` от ci.yml. Запускается ТОЛЬКО если CI завершился
# успешно (см. `if:` на job'е). Альтернатива (composite в ci.yml через
# `needs:`) хуже тем, что смешивает обязанности и делает невозможным
# отдельный `workflow_dispatch` для ручного re-deploy без перезапуска CI.
#
# Также поддерживается ручной запуск через `workflow_dispatch` — для
# случаев, когда нужно передеплоить ту же ревизию (например, после
# ротации `.env` на VPS).
#
# ВНИМАНИЕ: `workflow_dispatch` НЕ проверяет CI-статус выбранной ревизии.
# Деплоит HEAD ветки as-is. Оператор обязан вручную убедиться, что последний
# CI run на этой ветке зелёный, прежде чем запускать dispatch (см. runbook §12).
# Для защиты от случайного bypass — input `confirm_no_ci_check` (must be true).
#
# Архитектура (2026-05-27 — после appkit-oom-incident):
# Frontend build (vite + pnpm) выполняется НА RUNNER'е (16GB RAM, бесплатно),
# а не на 2GB VPS. Готовый dist/ rsync'ится на VPS в frontend-dist/, оттуда
# Caddy serves через volume mount (см. docker-compose.prod.yml). На VPS
# собираются только backend (api/worker) и кастомный Caddy с rate_limit —
# это лёгкие сборки, в RAM укладываются.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_no_ci_check:
        description: "Подтверждаю: CI на HEAD ветки зелёный (workflow_dispatch его не проверяет)"
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_run триггерится при ЛЮБОМ завершении CI (success/failure/cancelled).
    # Деплоим только на success. Для workflow_dispatch — github.event.workflow_run
    # отсутствует, разрешаем явно, НО требуем явного подтверждения
    # `confirm_no_ci_check`, так как dispatch CI-статус не проверяет.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_no_ci_check == true) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      # workflow_run даёт head_sha коммита, который триггернул CI.
      # workflow_dispatch — github.sha = HEAD ветки на которой запущен.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # ── Checkout того SHA, который деплоим ─────────────────────────────
      # ref важен: actions/checkout@v4 по дефолту чекаутит ветку workflow,
      # но для workflow_run это будет main HEAD, который мог уйти вперёд за
      # время CI. Нам нужен ровно тот коммит, который прошёл CI.
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ── Build frontend на runner'е ──────────────────────────────────────
      # 16GB RAM ubuntu-latest — vite build с AppKit + minification занимает
      # ~30-60 секунд, никаких OOM-рисков. Раньше build делался на VPS внутри
      # Caddy multi-stage Dockerfile и убивал 2GB машину (см. memory
      # project-appkit-oom-incident).
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (vite)
        working-directory: frontend
        env:
          # VITE_* инлайнятся в bundle на этапе build. Без этих env Sentry
          # становится no-op (см. frontend/src/sentry.js). Version banner
          # требует совпадения VITE_APP_VERSION с backend APP_VERSION
          # (отдаётся через /api/v1/config.version).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_APP_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
        # `pnpm build` = vite build → frontend/dist/. Используем короткий SHA
        # (первые 7 символов) для VITE_APP_VERSION — соответствует тому, что
        # backend получит через `git rev-parse --short HEAD` на VPS.
        run: |
          export VITE_APP_VERSION="${VITE_APP_VERSION:0:7}"
          echo "Building with VITE_APP_VERSION=${VITE_APP_VERSION}"
          pnpm build

      # ── Upload dist/ на VPS через rsync over SSH ───────────────────────
      # Atomic-ish: rsync с `--delete` заменяет содержимое frontend-dist/.
      # Caddy file_server lazy-reads с диска, кеша нет, новые requests
      # видят новый bundle сразу. Окно несогласованности (часть старых
      # файлов / часть новых) — порядка десятков мс, в практике невидимо.
      - name: Setup SSH key for rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_RAW: ${{ secrets.VPS_HOST }}
          VPS_PORT_RAW: ${{ secrets.VPS_PORT }}
        run: |
          # Тримим secrets — GitHub UI иногда вставляет trailing newline/space
          # из буфера обмена, ssh выдаёт "hostname contains invalid characters"
          # на raw $VPS_HOST. appleboy/ssh-action делает это сам внутри;
          # для shell ssh приходится явно.
          VPS_HOST=$(printf '%s' "$VPS_HOST_RAW" | tr -d '[:space:]')
          VPS_PORT=$(printf '%s' "$VPS_PORT_RAW" | tr -d '[:space:]')
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan: явно перечисляем типы ключей (-t) — без этого на
          # некоторых хостах keyscan возвращает пусто. -T 10 ставит timeout.
          # НЕ глотаем stderr — увидим в логе если keyscan фейлится.
          ssh-keyscan -T 10 -t rsa,ecdsa,ed25519 -p "$VPS_PORT" "$VPS_HOST" \
            >> ~/.ssh/known_hosts
          if ! grep -q "$VPS_HOST" ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan returned no keys for $VPS_HOST:$VPS_PORT"
            exit 1
          fi
          echo "Host keys added: $(wc -l < ~/.ssh/known_hosts) line(s)"

      # Бэкап текущей `frontend-dist/` через hardlink-копию ДО rsync'а —
      # позволяет откатить frontend если health-check провалится и rollback.sh
      # сработает (без бэкапа rollback откатил бы только backend, а bundle
      # остался бы новый = mismatch). `cp -al` мгновенный, не дублирует диск.
      # На first-time deploy frontend-dist может не существовать → `|| true`.
      # VPS_HOST/VPS_PORT приходят из $GITHUB_ENV (уже триммированы выше).
      - name: Backup current frontend dist on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "deploy@$VPS_HOST" \
            'cd /home/deploy/pitchterminal && \
             rm -rf frontend-dist.bak && \
             cp -al frontend-dist frontend-dist.bak 2>/dev/null || true'

      - name: Rsync frontend dist to VPS
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ \
            "deploy@$VPS_HOST:/home/deploy/pitchterminal/frontend-dist/"

      # ── Deploy backend / Caddy конфиг через SSH ────────────────────────
      # Frontend больше не пересобирается на VPS — docker compose build
      # перестроит только api/worker + Caddy (если её Dockerfile или
      # Caddyfile.prod изменились). pt-caddy перезапускается всё равно,
      # чтобы перечитать static (хотя read-only volume mount lazy-reads
      # с диска, restart не критичен).
      - name: Deploy via SSH
        # Pinned to full commit SHA (v1.0.3) — third-party action имеет доступ
        # к VPS_SSH_KEY через `envs`. Тег может быть переписан при компрометации
        # maintainer-аккаунта; SHA-pin защищает supply-chain.
        # Обновлять: проверить changelog, получить новый SHA через
        #   curl -sS https://api.github.com/repos/appleboy/ssh-action/git/ref/tags/<vX.Y.Z>
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # Таймаут на установку соединения и на выполнение команд.
          # command_timeout 10m был достаточен пока build был лёгкий
          # (без AppKit). Frontend ушёл на runner, на VPS остался только
          # backend + Caddy — оба собираются за <60s. 10m с большим запасом.
          timeout: 30s
          command_timeout: 10m
          # `script_stop: true` — упасть на первой ошибке (set -e в стиле action).
          script_stop: true
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /home/deploy/pitchterminal

            # Сохранить предыдущий SHA для возможного rollback.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            echo "Previous SHA: ${PREVIOUS_SHA}"
            echo "Target SHA:   ${DEPLOY_SHA}"

            # Обновляем код. reset --hard — защита от случайных локальных
            # модификаций на VPS (которых не должно быть, но мы консервативны).
            git fetch origin main
            git reset --hard "${DEPLOY_SHA}"

            # APP_VERSION — short git SHA. Прокидываем в backend env (api/worker
            # → /config?.version). Frontend VITE_APP_VERSION уже инлайн'ен в
            # bundle на runner-стадии — этот SHA должен с ним совпадать.
            export APP_VERSION="$(git rev-parse --short HEAD)"
            echo "APP_VERSION: ${APP_VERSION}"

            cd infra

            # Только backend + Caddy. Frontend пришёл rsync'ом, в Dockerfile
            # Caddy больше нет frontend-builder stage'а. pt-caddy build
            # быстрый (~5-10s), api/worker — ~10-20s с cache'ем.
            docker compose --env-file ../.env \
              -f docker-compose.yml -f docker-compose.prod.yml pull postgres
            docker compose --env-file ../.env \
              -f docker-compose.yml -f docker-compose.prod.yml build
            # --remove-orphans: убрать контейнеры, которые остались от старых
            # compose-конфигов (например, переименованный/удалённый сервис).
            docker compose --env-file ../.env \
              -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Cold-start пауза: миграции (api контейнер запускает alembic;
            # worker ждёт пока схема дойдёт до head — см. scripts/entrypoint.sh),
            # healthcheck окно (start_period: 60s).
            echo "Waiting 60s for cold-start..."
            sleep 60

            # Health check изнутри VPS — bypass'ит Caddy/TLS. 5 × 15s = 75s
            # запаса сверх 60s sleep, на случай длинной миграции.
            HEALTH_OK=0
            for attempt in 1 2 3 4 5; do
              if docker exec pt-api curl -fsS --max-time 5 http://localhost:8000/api/v1/health > /dev/null 2>&1; then
                echo "Health check passed (attempt ${attempt})."
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Health check FAILED after 5 attempts — rolling back to ${PREVIOUS_SHA}"
              cd /home/deploy/pitchterminal
              bash scripts/rollback.sh "${PREVIOUS_SHA}"
              exit 1
            fi

            # Sanity check: /config.version должен совпадать с APP_VERSION,
            # иначе фронт не сможет показывать update-banner и юзеры будут
            # ловить stale-bundle ошибки тихо. Не блокирующий fail —
            # деплой считается успешным, но мы шумим в логах workflow.
            DEPLOYED_VERSION="$(docker exec pt-api curl -fsS --max-time 5 http://localhost:8000/api/v1/config | python3 -c 'import json,sys;print(json.load(sys.stdin).get("version",""))' || echo "")"
            if [ "${DEPLOYED_VERSION}" != "${APP_VERSION}" ]; then
              echo "::warning::/config.version='${DEPLOYED_VERSION}' != APP_VERSION='${APP_VERSION}' — version-check banner will not function correctly"
            fi

      # ── Очистка SSH-ключа на runner'е ───────────────────────────────────
      # Параноя: GitHub runner'ы эфемерные, всё равно убиваются после job'а,
      # но явное удаление приватного ключа — defence-in-depth.
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
